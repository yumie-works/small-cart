<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ログイン | Sample Mart</title><link rel="stylesheet" href="style.css"><script src="app.js"></script></head>
<body data-page="login"><header class="bar"><span class="logo">Sample Mart</span><span class="demo">検証用ダミーサイト（架空）</span></header><main>
<h1 data-testid="login-title">ログイン</h1>
<p>検証用のダミーアカウントでログインします（実在のサービスとは関係ありません）。</p>
<label>ユーザーID <input data-testid="login-id-input" autocomplete="off"></label><br>
<label>パスワード <input type="password" data-testid="password-input" autocomplete="off"></label><br>
<button class="primary" data-testid="login-button">ログイン</button>
<p class="note" data-testid="login-error" hidden>ユーザーIDまたはパスワードが違います</p>
</main></body></html>
